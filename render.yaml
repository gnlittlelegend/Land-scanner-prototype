services:
  - type: web
    name: land-scanner-prototype-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerBuildContextPath: .
    startCommand: ""
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

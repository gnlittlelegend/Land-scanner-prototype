services:
  - type: web
    name: land-scanner-prototype
    env: docker
    plan: free
    region: oregon
    branch: main
    buildCommand: ""
    startCommand: ""
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true
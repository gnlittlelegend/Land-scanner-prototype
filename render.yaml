services:
  # Backend Web Service: FastAPI API server
  - type: web
    name: land-scanner-prototype-backend
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

  # Frontend Static Site: serves static frontend files
  - type: static
    name: land-scanner-prototype
    env: static
    region: oregon
    branch: main
    build:
      publishDir: frontend
      command: "echo 'Static site build complete' && ls -la frontend/"

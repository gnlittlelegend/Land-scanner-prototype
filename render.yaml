services:
  # Backend Web Service: FastAPI application (Docker runtime for Python 3.11)
  - type: web
    name: land-scanner-prototype-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerBuildContextPath: .
    startCommand: ""
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

  # Frontend Static Site: serves static frontend files
  - type: static
    name: land-scanner-prototype
    region: oregon
    branch: main
    build:
      publishDir: frontend
      command: "echo 'Static site build complete' && ls -la frontend/"

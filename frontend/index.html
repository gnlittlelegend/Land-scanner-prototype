<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Scanner Prototype</title>
    <!-- Leaflet CSS for mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw plugin for polygon drawing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <!-- Custom styling -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header with application title and version -->
        <header>
            <h1>Land Scanner</h1>
            <p class="subtitle">Prototype v1.0.0 - Geospatial Land Analysis</p>
        </header>
        
        <!-- Main content area with map and controls -->
        <div class="main-content">
            <!-- Interactive map for polygon input -->
            <div id="map" class="map-container"></div>
            
            <!-- Control panel for user interactions -->
            <div class="control-panel">
                <div class="control-group">
                    <label for="geojson-input">Upload GeoJSON:</label>
                    <input type="file" id="geojson-input" accept=".geojson,.json" title="Upload a GeoJSON file">
                </div>
                <div class="control-group">
                    <button id="clear-polygon" class="btn btn-danger">Clear Polygon</button>
                    <button id="analyze-btn" class="btn btn-primary">Analyze</button>
                </div>
            </div>
        </div>
        
        <!-- Results display panel -->
        <div id="result-panel" class="result-panel hidden">
            <h2>Analysis Results</h2>
            <div id="results-content" class="results-content"></div>
        </div>
        
        <!-- Error display panel -->
        <div id="error-panel" class="error-panel hidden">
            <div class="error-header">
                <h3>Error</h3>
                <button class="close-btn" onclick="document.getElementById('error-panel').classList.add('hidden')">×</button>
            </div>
            <div id="error-content" class="error-content"></div>
        </div>
        
        <!-- Loading indicator -->
        <div id="loading-indicator" class="loading-indicator hidden">
            <div class="spinner"></div>
            <p>Processing analysis...</p>
        </div>
    </div>
    
    <!-- External scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <!-- Application logic -->
    <script src="js/app.js"></script>
</body>
</html>
